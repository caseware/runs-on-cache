name: 'Ordered Cache Restore'
description: |
  Restores cache by trying an ordered list of cache keys. Supports two modes:

  **Mode 1 — Explicit key list** (`cache-keys`):
    Pass a newline-separated list of keys to try in order.
    Useful for time-based keys, week/year patterns, or any non-hash-based ordering.
    Example (week-based node_modules):
      nodemodules-2026-W17-abc123
      nodemodules-2026-W16-def456
      nodemodules-2026-W15-789012

  **Mode 2 — Hash-walk** (`hash-file` + `key-prefix`):
    Walks git history commit-by-commit, hashing the specified file at each depth.
    Generates keys as "{key-prefix}-{sha256(file@HEAD~N)}".
    Stops at the first S3 hit. Deduplicates identical hashes across commits.
    Useful for lockfile-based caching (yarn.lock, package-lock.json, Gemfile.lock).

  Returns which key matched and whether it was an exact or partial hit.
  The first key (Mode 1) or HEAD hash (Mode 2) is the "exact" key — all others are "partial".

  When `previous-version-mount` is "true" and a PARTIAL hit occurs, the matched (old)
  image stays mounted READ-ONLY at a secondary path exposed via `previous-version-path`.
  The primary cache path gets a fresh empty BTRFS image for population. Use this for the
  "git alternates" pattern: reference old .git/objects via GIT_ALTERNATE_OBJECT_DIRECTORIES
  while building a new clone, then save the new image under the exact requested key.
inputs:
  # --- Mode 1: Explicit key list ---
  cache-keys:
    description: |
      Ordered list of cache keys to try, one per line.
      The first key is the "exact" key. If it matches, cache-hit-type is "exact".
      Subsequent keys are fallbacks. If one matches, cache-hit-type is "partial".
      If none match, cache-hit-type is "miss".
      Mutually exclusive with hash-file/key-prefix.

      Example — week-based yarn cache:
        yarn-cache-2026-W17-${{ hashFiles('yarn.lock') }}
        yarn-cache-2026-W16-${{ hashFiles('yarn.lock') }}
        yarn-cache-2026-W15-${{ hashFiles('yarn.lock') }}

      Example — branch-priority ordering:
        cache-${{ github.head_ref }}-${{ hashFiles('yarn.lock') }}
        cache-develop-${{ hashFiles('yarn.lock') }}
        cache-main-${{ hashFiles('yarn.lock') }}
    required: false
  # --- Mode 2: Git history hash walk ---
  hash-file:
    description: |
      Path to a file to hash at each git commit (e.g., yarn.lock).
      Used with key-prefix to generate cache keys: "{key-prefix}-{sha256(file@HEAD~N)}".
      Walks one depth level at a time to minimize hashing cost.
      Stops early if the file doesn't exist at a given ref.
    required: false
  key-prefix:
    description: |
      Prefix for hash-walk generated keys. Combined with the file hash:
      "{key-prefix}-{sha256(file@HEAD~N)}". Required when hash-file is set.
    required: false
  hash-ref:
    description: 'Git ref to start walking from (default: HEAD)'
    required: false
    default: 'HEAD'
  hash-depth:
    description: 'Maximum number of commits to walk back (default: 20)'
    required: false
    default: '20'
  # --- Common inputs ---
  path:
    description: 'A list of files, directories, and wildcard patterns to cache and restore'
    required: true
  custom-compression:
    description: 'Custom compression method (e.g., lz4, btrfs)'
    required: false
    default: 'lz4'
  custom-compression-level:
    description: 'Level of compression for the custom method'
    required: false
  fs-size:
    description: 'Filesystem size for btrfs format (e.g., 50G)'
    default: '50G'
    required: false
  fs-buffer-mb:
    description: 'Additional buffer size for btrfs format (e.g., 2048) after image resize.'
    default: '2048'
    required: false
  node-local-cache-dir:
    description: 'Path to node-local persistent cache directory (HostPath mount on EKS). When set, images are cached on the node for instant restore. Falls back to S3 on miss.'
    default: ''
    required: false
  mount-mode:
    description: |
      Mount mode for restored cache:
        "rw" (read-write, default) — image is copied and mounted read-write for augmentation.
        "ro" (read-only) — shared image mounted read-only from node-local HostPath.
    default: 'rw'
    required: false
  previous-version-mount:
    description: |
      When "true" and a PARTIAL cache hit occurs, mount the closest matching image
      read-only at a secondary mount point (exposed via previous-version-path output).
      The primary cache gets a fresh empty BTRFS image for population.
      Use this for the "git alternates" pattern: reference old .git/objects via
      GIT_ALTERNATE_OBJECT_DIRECTORIES while building a new clone.
      When "false" (default), partial hits use the copy+augment pattern instead.
    default: 'false'
    required: false
outputs:
  matched-key:
    description: 'The cache key that was matched, or empty string if miss'
  cache-hit-type:
    description: 'exact if the first key matched, partial if a fallback matched, miss if none matched'
  cache-hit:
    description: 'true if any key matched (exact or partial), false if miss'
  node-local-cache-hit:
    description: 'Whether the cache was restored from node-local storage: "true" (node-local hit), "false" (S3 fallback), or "disabled" (node-local not configured)'
  previous-version-path:
    description: |
      When previous-version-mount is "true" and a partial hit occurred, the mount point
      where the previous version is accessible read-only. Empty string if not applicable
      (exact hit, miss, or previous-version-mount disabled).
      Consumer can use this for GIT_ALTERNATE_OBJECT_DIRECTORIES or to reference old LFS objects.
runs:
  using: 'node20'
  main: '../dist/ordered-restore/index.js'
  post: '../dist/save/index.js'
  post-if: "success() || github.event.inputs.save-always"

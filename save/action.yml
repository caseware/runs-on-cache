name: 'Save a cache'
description: 'Save Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'GitHub'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache'
    required: true
  key:
    description: 'An explicit key for saving the cache'
    required: true
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to save caches that can be restored on other platforms'
    default: 'false'
    required: false
  sync:
    description: 'An optional boolean when enabled, Does not create an archive and syncs the contents of the cache directory directly to the cache location'
    default: 'false'
    required: false
  custom-compression:
    description: 'Creates tar archive with custom compression'
    required: false
  custom-compression-level:
    description: 'Level of compression for the custom method. Syntax varies per method.'
    required: false
  fs-size:
    description: 'Virtual size of the filesystem image (btrfs/xfs backends), e.g. 25G.'
    required: false
  fs-buffer-mb:
    description: 'Headroom buffer in MB added when sizing the image.'
    required: false
  save-compression-level:
    description: 'Compression level applied when saving the image (e.g. zstd:9).'
    required: false
  mount-mode:
    description: 'Mount mode for the cache image: ro or rw.'
    required: false
  node-local-cache-dir:
    description: 'Node-local hostPath dir for the WORM image copy (k8s runners).'
    required: false
  cleanup-node-local:
    description: 'Node-local cleanup policy: none | stale | always.'
    required: false
  fail-on-save-error:
    description: 'Fail the action (non-zero exit) if the save fails. Use for the producer/warm job so a failed save fails the job natively.'
    required: false
    default: 'false'
  force-save:
    description: 'Force a save even when the restored key matches the primary key.'
    required: false
    default: 'false'
runs:
  using: 'node24'
  main: '../dist/save-only/index.js'
branding:
  icon: 'archive'
  color: 'gray-dark'

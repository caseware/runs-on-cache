name: 'Fast actions/cache for S3'
description: 'Drop-in GitHub actions/cache replacement with S3 backend'
author: 'RunsOn'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache and restore'
    required: true
  key:
    description: 'An explicit key for restoring and saving the cache'
    required: true
  restore-keys:
    description: 'An ordered list of keys to use for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.'
    required: false
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms'
    default: 'false'
    required: false
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found'
    default: 'false'
    required: false
  force-save:
    description: 'Force save the cache, even if an existing cache entry is found for the key'
    default: 'false'
    required: false
  lookup-only:
    description: 'Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache'
    default: 'false'
    required: false
  save-always:
    description: 'Run the post step to save the cache even if another step before fails'
    default: 'false'
    required: false
  custom-compression:
    description: 'Custom compression method (e.g., lz4, btrfs)'
    required: false
  custom-compression-level:
    description: 'Level of compression for the custom method. Syntax varies per method.'
    required: false
  sync:
    description: 'Use sync method for caching'
    default: 'false'
    required: false
  fs-size:
    description: 'Filesystem size for btrfs format (e.g., 50G)'
    default: '50G'
    required: false
  fs-buffer-mb:
    description: 'Additional buffer in MB beyond Device allocated for btrfs resize (e.g., 256). Smaller = tighter images = faster copies.'
    default: '256'
    required: false
  save-compression-level:
    description: 'Compression level for BTRFS defrag before upload (e.g., zstd:9). Higher = smaller image, same read perf. Default: zstd:9.'
    default: 'zstd:9'
    required: false
  node-local-cache-dir:
    description: 'Path to node-local persistent cache directory (HostPath mount on EKS). When set, BTRFS/VHDX images are cached on the node for instant restore. Falls back to S3 on miss. Default: empty (disabled). Recommended: /opt/local-volumes/btrfs-cache/'
    default: ''
    required: false
  fail-on-save-error:
    description: 'Fail the action if cache save encounters an error (useful for cache validation tests)'
    default: 'false'
    required: false
  cleanup-node-local:
    description: |
      Controls cleanup of node-local BTRFS images after the job:
        "none"   — no cleanup; all images stay on disk regardless of outcome.
        "stale"  — (default) delete images from failed/cancelled jobs; keep successful ones as restore bases.
        "always" — delete the image after every job, even if the save succeeded.
    default: 'stale'
    required: false
  max-node-local-gb:
    description: 'Maximum total size (GB) for node-local WORM images. When exceeded, oldest images are evicted (LRU). Set to 0 to disable. Default: 30.'
    default: '30'
    required: false
  mount-mode:
    description: |
      Mount mode for restored cache:
        "rw" (read-write, default) — image is copied to a job-local dir and mounted read-write.
          Supports both exact and partial cache hits. Partial hits are augmented in-place (e.g., yarn install adds the delta).
          Save writes back the modified image with the exact requested key.
        "ro" (read-only) — shared BTRFS image mounted read-only directly from the node-local HostPath.
          Used for immutable caches like node_modules where the image is never modified.
          Only works for exact hits with node-local HostPath caching enabled.
          The image is shared across all jobs on the same node (WORM pattern).
    default: 'rw'
    required: false
outputs:
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
  node-local-cache-hit:
    description: 'Whether the cache was restored from node-local storage: "true" (node-local hit), "false" (S3 fallback), or "disabled" (node-local not configured)'
runs:
  using: 'node20'
  main: 'dist/restore/index.js'
  post: 'dist/save/index.js'
  post-if: "always()"
branding:
  icon: 'archive'
  color: 'gray-dark'

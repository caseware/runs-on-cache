name: 'Fast actions/cache for S3'
description: 'Drop-in GitHub actions/cache replacement with S3 backend'
author: 'RunsOn'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache and restore'
    required: true
  key:
    description: 'An explicit key for restoring and saving the cache'
    required: true
  restore-keys:
    description: 'An ordered list of keys to use for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.'
    required: false
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms'
    default: 'false'
    required: false
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found'
    default: 'false'
    required: false
  force-save:
    description: 'Force save the cache, even if an existing cache entry is found for the key'
    default: 'false'
    required: false
  lookup-only:
    description: 'Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache'
    default: 'false'
    required: false
  save-always:
    description: 'Run the post step to save the cache even if another step before fails'
    default: 'false'
    required: false
  custom-compression:
    description: 'Custom compression method (e.g., lz4, btrfs)'
    required: false
  custom-compression-level:
    description: 'Level of compression for the custom method. Syntax varies per method.'
    required: false
  sync:
    description: 'Use sync method for caching'
    default: 'false'
    required: false
  fs-size:
    description: 'Filesystem size for btrfs format (e.g., 50G)'
    default: '50G'
    required: false
  fs-buffer-mb:
    description: 'Additional buffer size for btrfs format (e.g., 2048) after image resize.'
    default: '2048'
    required: false
  save-compression-level:
    description: 'Compression level for BTRFS defrag before upload (e.g., zstd:9). Higher = smaller image, same read perf. Default: zstd:9.'
    default: 'zstd:9'
    required: false
  node-local-cache-dir:
    description: 'Path to node-local persistent cache directory (HostPath mount on EKS). When set, BTRFS/VHDX images are cached on the node for instant restore. Falls back to S3 on miss. Default: empty (disabled). Recommended: /opt/local-volumes/btrfs-cache/'
    default: ''
    required: false
  mount-mode:
    description: 'Mount mode for restored cache: "rw" (read-write, default — image is mounted read-write, supports both exact and partial cache hits) or "ro" (read-only — shared BTRFS image mounted read-only, only for exact hits with node-local HostPath caching)'
    default: 'rw'
    required: false
outputs:
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
  node-local-cache-hit:
    description: 'Whether the cache was restored from node-local storage: "true" (node-local hit), "false" (S3 fallback), or "disabled" (node-local not configured)'
runs:
  using: 'node20'
  main: 'dist/restore/index.js'
  post: 'dist/save/index.js'
  post-if: "success() || github.event.inputs.save-always"
branding:
  icon: 'archive'
  color: 'gray-dark'

name: 'Workspace cache setup'
description: >-
  Single composite step that configures AWS credentials, installs platform-specific
  tools, computes the daily workspace cache key, and restores (or creates) the
  workspace image.  Supports BTRFS on Linux and VHDX on Windows.
  Should run BEFORE actions/checkout in any job that uses the unified workspace cache.
inputs:
  aws-role-arn:
    description: 'IAM role ARN for AWS credentials (S3 cache access)'
    required: true
  session-name:
    description: 'AWS role session name suffix (e.g. get-affected, warm-workspace)'
    required: false
    default: 'workspace-cache'
  run-number:
    description: 'GitHub run number (for unique session names)'
    required: false
    default: '0'
  s3-bucket:
    description: 'S3 bucket for the cache'
    required: false
    default: 'ust1-cache-code-github-actions-develop-1'
  custom-compression:
    description: >-
      Custom compression method (btrfs or vhdx).
      Defaults to auto-detect: btrfs on Linux, vhdx on Windows.
    required: false
    default: ''
  force-save:
    description: 'Always save (even on exact key match). Used by the warm-up job.'
    required: false
    default: 'false'
  fail-on-save-error:
    description: 'Fail the job if the save pipeline errors.'
    required: false
    default: 'false'
outputs:
  cache-hit:
    description: 'Whether an exact cache key matched'
    value: ${{ steps.workspace-cache.outputs.cache-hit }}
  cache-key:
    description: 'The computed cache key for today'
    value: ${{ steps.ws-cache-key-linux.outputs.key || steps.ws-cache-key-windows.outputs.key }}
runs:
  using: composite
  steps:
    # ── AWS Credentials (cross-platform) ──────────────────────────────
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        role-session-name: ${{ inputs.session-name }}-${{ inputs.run-number }}
        role-skip-session-tagging: true
        aws-region: us-east-1
        role-duration-seconds: 7200

    # ── S3 env vars (Linux) ───────────────────────────────────────────
    - name: Set persistent S3 env vars (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "AWS_REGION=${AWS_REGION:-us-east-1}" >> "$GITHUB_ENV"
        echo "RUNS_ON_S3_BUCKET_CACHE=${{ inputs.s3-bucket }}" >> "$GITHUB_ENV"

    # ── S3 env vars (Windows) ─────────────────────────────────────────
    - name: Set persistent S3 env vars (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $region = if ($env:AWS_REGION) { $env:AWS_REGION } else { "us-east-1" }
        "AWS_REGION=$region" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "RUNS_ON_S3_BUCKET_CACHE=${{ inputs.s3-bucket }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    # ── Install btrfs-progs (Linux only) ──────────────────────────────
    - name: Install btrfs-progs
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v mkfs.btrfs &>/dev/null; then
          sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs
        fi

    # ── Compute workspace cache key (Linux) ───────────────────────────
    - name: Compute workspace cache key (Linux)
      if: runner.os == 'Linux'
      id: ws-cache-key-linux
      shell: bash
      run: |
        ARCH="$(uname -m)"
        TODAY="$(date -u +'%Y-%m-%d')"
        PREFIX="workspace-cache-v1-${RUNNER_OS}-${ARCH}"
        EXACT_KEY="${PREFIX}-${TODAY}"
        # Build restore keys: last 7 days + bare prefix (max 10 keys total incl primary)
        RESTORE_KEYS=""
        for i in $(seq 1 7); do
          DAY="$(date -u -d "${i} days ago" +'%Y-%m-%d' 2>/dev/null || date -u -v-${i}d +'%Y-%m-%d' 2>/dev/null)"
          if [ -n "$DAY" ]; then
            RESTORE_KEYS="${RESTORE_KEYS}${PREFIX}-${DAY}
        "
          fi
        done
        RESTORE_KEYS="${RESTORE_KEYS}${PREFIX}-"
        echo "key=${EXACT_KEY}" >> "$GITHUB_OUTPUT"
        {
          echo "restore-keys<<EOF"
          echo "$RESTORE_KEYS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "Cache key: ${EXACT_KEY}"

    # ── Compute workspace cache key (Windows) ─────────────────────────
    - name: Compute workspace cache key (Windows)
      if: runner.os == 'Windows'
      id: ws-cache-key-windows
      shell: pwsh
      run: |
        $arch = if ($env:PROCESSOR_ARCHITECTURE) { $env:PROCESSOR_ARCHITECTURE } else { "AMD64" }
        $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
        $prefix = "workspace-cache-v1-$($env:RUNNER_OS)-$arch"
        $exactKey = "$prefix-$today"
        $restoreKeys = @()
        for ($i = 1; $i -le 7; $i++) {
          $day = (Get-Date).ToUniversalTime().AddDays(-$i).ToString("yyyy-MM-dd")
          $restoreKeys += "$prefix-$day"
        }
        $restoreKeys += "$prefix-"
        "key=$exactKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "restore-keys<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        ($restoreKeys -join "`n") | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Cache key: $exactKey"

    # ── Auto-detect compression method ────────────────────────────────
    - name: Resolve compression method
      id: resolve-compression
      shell: bash
      run: |
        INPUT="${{ inputs.custom-compression }}"
        if [ -z "$INPUT" ]; then
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "method=vhdx" >> "$GITHUB_OUTPUT"
          else
            echo "method=btrfs" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "method=$INPUT" >> "$GITHUB_OUTPUT"
        fi

    # ── Restore workspace cache ───────────────────────────────────────
    - name: Restore workspace cache
      id: workspace-cache
      uses: caseware/runs-on-cache@add-btrfs-lz4
      with:
        path: .
        key: ${{ steps.ws-cache-key-linux.outputs.key || steps.ws-cache-key-windows.outputs.key }}
        restore-keys: ${{ steps.ws-cache-key-linux.outputs.restore-keys || steps.ws-cache-key-windows.outputs.restore-keys }}
        custom-compression: ${{ steps.resolve-compression.outputs.method }}
        mount-mode: rw
        fs-size: 50G
        force-save: ${{ inputs.force-save }}
        fail-on-save-error: ${{ inputs.fail-on-save-error }}

    # Pre-start NX daemon from cached workspace-data so postinstall's
    # nx run-many connects to a warm graph instead of loading cold (~50s).
    # Must remove stale d/ first — it has a PID from the cache-save machine.
    - name: Pre-start NX daemon
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ -d ".nx/workspace-data" ] && [ -d "node_modules/.bin" ]; then
          rm -rf .nx/workspace-data/d
          ./node_modules/.bin/nx daemon --start &>/dev/null &
          echo "NX daemon pre-started (PID: $!)"
        else
          echo "No workspace-data or node_modules — skipping daemon pre-start"
        fi

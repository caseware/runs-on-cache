name: Tests

on:
  pull_request:
    branches:
      - main
      - releases/**
      - v5
  push:
    branches:
      - main
      - releases/**
      - fix/**
      - v4
      - v5

jobs:
  test-filesystem-archive:
    name: Filesystem archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Expose LZ4 on Linux and macOS
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if ! command -v lz4 >/dev/null 2>&1; then
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/lz4-1.10.0.tar.gz" \
            https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/lz4-1.10.0.tar.gz.sha256" \
            https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz.sha256
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "${RUNNER_TEMP}" && sha256sum --check lz4-1.10.0.tar.gz.sha256)
          else
            (cd "${RUNNER_TEMP}" && shasum --algorithm 256 --check lz4-1.10.0.tar.gz.sha256)
          fi
          tar -xzf "${RUNNER_TEMP}/lz4-1.10.0.tar.gz" -C "${RUNNER_TEMP}"
          make -C "${RUNNER_TEMP}/lz4-1.10.0"
          echo "${RUNNER_TEMP}/lz4-1.10.0/programs" >> "${GITHUB_PATH}"
        fi
    - name: Expose LZ4 on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        if (-Not (Get-Command lz4 -ErrorAction SilentlyContinue)) {
          Invoke-WebRequest -Uri "https://github.com/lz4/lz4/releases/download/v1.10.0/lz4_win64_v1_10_0.zip" -OutFile "$env:RUNNER_TEMP\lz4.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\lz4.zip" -DestinationPath "$env:RUNNER_TEMP\lz4"
          "$env:RUNNER_TEMP\lz4" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
    - name: Install dependencies
      run: npm ci
    - name: Test filesystem archive round trips
      run: npm test -- --runInBand __tests__/tarLz4ContainerFilesystem.test.ts

  # End to end save and restore
  test-save:
    runs-on: runs-on,runner=2cpu-linux-arm64
    strategy:
      matrix:
        part_size: [32]
        queue_size: [4, 8]
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Generate files in working directory
      shell: bash
      run: |
        __tests__/create-cache-files.sh ${{ runner.os }} test-cache
        # 5GB
        # curl -o test-cache/ubuntu.iso https://releases.ubuntu.com/22.04.3/ubuntu-22.04.3-desktop-amd64.iso
        # 2Gb
        curl -o test-cache/ubuntu.iso https://releases.ubuntu.com/jammy/ubuntu-22.04.3-live-server-amd64.iso
    - name: Generate files outside working directory
      shell: bash
      run: __tests__/create-cache-files.sh ${{ runner.os }} ~/test-cache
    - name: Save cache
      uses: ./
      env:
        UPLOAD_PART_SIZE: ${{ matrix.part_size }}
        UPLOAD_QUEUE_SIZE: ${{ matrix.queue_size }}
      with:
        key: test-${{ runner.os }}-${{ github.run_id }}-${{ matrix.part_size }}-${{ matrix.queue_size }}
        path: |
          test-cache
          ~/test-cache
  test-restore:
    needs: test-save
    strategy:
      matrix:
        part_size: [8, 16]
        queue_size: [8, 12]
      fail-fast: false
    runs-on: runs-on,runner=2cpu-linux-arm64
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Restore cache
      uses: ./
      env:
        DOWNLOAD_PART_SIZE: ${{ matrix.part_size }}
        DOWNLOAD_QUEUE_SIZE: ${{ matrix.queue_size }}
      with:
        key: test-${{ runner.os }}-${{ github.run_id }}-${{ matrix.part_size }}-${{ matrix.queue_size }}
        restore-keys: |
          test-${{ runner.os }}-${{ github.run_id }}-${{ matrix.part_size }}-
          test-${{ runner.os }}-${{ github.run_id }}-
        path: |
          test-cache
          ~/test-cache
    - name: Verify cache files in working directory
      shell: bash
      run: __tests__/verify-cache-files.sh ${{ runner.os }} test-cache
    - name: Verify cache files outside working directory
      shell: bash
      run: __tests__/verify-cache-files.sh ${{ runner.os }} ~/test-cache
